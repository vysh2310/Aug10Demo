name: Main Merge Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  polyspace-and-tests:
    name: Polyspace and PSTUnit
    runs-on:
      - self-hosted
      - windows
      - X64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate runner prerequisites
        shell: powershell
        run: .\scripts\validate-runner-prereqs.ps1

      - name: Run merge gate
        shell: powershell
        run: .\scripts\run-main-merge-gate.ps1
